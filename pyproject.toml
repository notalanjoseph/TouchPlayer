[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touchplayer"
version = "1.0.1"
description = "A lightweight, gesture-driven Wayland media player for Linux touchscreen laptops"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "Alan Joseph", email = "notalanjoseph@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "PyQt6",
    "Pillow"
]

[project.urls]
Homepage = "https://github.com/notalanjoseph/TouchPlayer"

[project.scripts]
touchplayer = "EasyPlayer:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"*" = [
    "icons/*",
    "icons/**/*",
]

[tool.bumpversion]
current_version = "1.0.1"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Release v{new_version}"

[[tool.bumpversion.files]]
filename = "src/EasyPlayer.py"
search = 'Version = "{current_version}"'
replace = 'Version = "{new_version}"'
